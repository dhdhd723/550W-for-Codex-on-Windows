[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-550c-launcher"
version = "0.3.1"
description = "Independent Windows launcher with an adapted 550C HTML animation"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6==6.11.2"]
readme = "README.md"

[project.optional-dependencies]
build = ["PyInstaller==6.22.3"]

[tool.setuptools]
py-modules = ["main"]
packages = ["launcher"]

# The source folder is the portable project; build.ps1 bundles local web assets.
# Do not publish this project to PyPI: the original animation license is unresolved.
