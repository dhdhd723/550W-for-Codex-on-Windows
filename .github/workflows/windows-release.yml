name: Build 550W Windows editions

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'PRIVACY.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
      - name: Validate source and edition policy
        run: |
          node tests/animation_static.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Animation fidelity check failed.' }
          python -m unittest tests.test_core tests.test_edition_policy -v
          if ($LASTEXITCODE -ne 0) { throw 'Edition policy tests failed.' }
      - name: Build both named portable editions
        run: |
          $buildPython = (Get-Command python).Source
          ./scripts/build.ps1 -Python $buildPython -SkipInstall
      - name: Publish two ZIP files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'v0.3.0'
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw 'This release already exists. Keep its assets; bump the version before another release.'
          }
          gh release create $tag 'dist/550W简洁版.zip' 'dist/550W完整版.zip' 'dist/SHA256SUMS.txt' --target $env:GITHUB_SHA --title '550W 0.3.0 — 简洁版与完整版' --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
